        '<p class="note" id="savedNote">Changes save automatically on this device.</p></div>'+
      '<div class="card noprint acc-tide"><h2>What to include</h2><div class="field"><span class="lbl">Check-in period</span>'+segHTML('sumDays',[[30,'30 days'],[90,'90 days'],[180,'6 months']],days)+'</div>'+
        '<div class="field"><span class="lbl">Extra sections</span><div class="chips" id="incChips">'+incChips()+'</div></div>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-primary" id="printBtn">Print or save as PDF</button><button type="button" class="btn btn-quiet" id="copyBtn">Copy as text</button></div><div id="copyOut"></div>'+
        '<p class="note" style="margin-top:10px">In the print dialog, choose “Save as PDF” to keep a copy or email it. The page below is exactly what prints. If printing does nothing on your phone, use Copy as text, paste it into Notes or an email, and print from there.</p></div>'+
      '<div class="sheet" id="sheet">'+sheetHTML()+'</div>';
      root.addEventListener('input',function(ev){
        if(/^p-/.test(ev.target.id)){
          saveDetails();const n=$('#savedNote',root);if(n)n.textContent='Saving…';
          S.profile.summary=Object.assign({},S.profile.summary||{},formValues());refreshSheet();
        }
      });
      root.addEventListener('click',function(ev){
        const sg=ev.target.closest('#sumDays button');
        if(sg){days=parseInt(sg.dataset.v,10);$$('#sumDays button',root).forEach(b=>b.setAttribute('aria-pressed',String(b===sg)));refreshSheet();return;}
        const ic=ev.target.closest('[data-inc]');
        if(ic){const k=ic.dataset.inc;inc[k]=!inc[k];ic.setAttribute('aria-pressed',String(inc[k]));refreshSheet();return;}
        if(ev.target.id==='printBtn'){try{window.print();}catch(e){toast('Printing isn’t available in this browser.');}return;}
        if(ev.target.id==='copyBtn'){
          const sh=$('#sheet',root),t=((sh.innerText||sh.textContent)||'').replace(/\n{3,}/g,'\n\n').trim(),out=$('#copyOut',root);
          (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{out.innerHTML='';toast('Summary copied');}).catch(()=>{out.innerHTML='<p class="note" style="margin-top:10px">Select all, copy, and paste into Notes or an email:</p><textarea class="mono" readonly rows="10" id="copyTa2">'+esc(t)+'</textarea>';const ta=$('#copyTa2',root);if(ta)ta.select();});
        }
      });
    },
    update(c){
      if(c==='profile')return;
      if(c==='*'||c==='daily'||c==='labs'||c==='scans'||c==='measures'||c==='workouts'||c==='cardio'||c==='meds')refreshSheet();
    }
  };
}

/* ---------- shell ---------- */
const TABS=[
 {id:'today',label:'Today',make:makeToday,icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'},
 {id:'train',label:'Train',make:makeTrain,icon:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>'},
 {id:'trends',label:'Trends',make:makeTrends,icon:'<path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/>'},
 {id:'labs',label:'Records',make:makeRecords,icon:'<path d="M9 4h6v3H9z"/><path d="M7 5.5H5V21h14V5.5h-2"/><path d="M9 12h6M9 16h6"/>'},
 {id:'summary',label:'Summary',make:makeSummary,icon:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>'},
 {id:'plan',label:'Plan',make:makePlan,icon:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'}
];
let view=null,currentTab='today';
function show(id){
  currentTab=id;
  const t=TABS.filter(x=>x.id===id)[0];
  const host=$('#view');host.innerHTML='';
  const root=document.createElement('div');host.appendChild(root);
  view=t.make();view.mount(root);
  $$('.tab').forEach(b=>{if(b.dataset.tab===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  window.scrollTo(0,0);
  try{localStorage.setItem('recovery.tab',id);}catch(e){}
}
function onData(c){if(view&&view.update)view.update(c);}
function buildTabs(){
  $('#tabbar').innerHTML=TABS.map(t=>'<button type="button" class="tab" data-tab="'+t.id+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>'+t.label+'</button>').join('');
  $('#tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.tab);});
}
buildTabs();
try{const t=localStorage.getItem('recovery.tab');if(t&&TABS.some(x=>x.id===t))currentTab=t;}catch(e){}
setStatus();
show(currentTab);
document.addEventListener('click',function(e){const g=e.target.closest&&e.target.closest('[data-goto]');if(g)show(g.dataset.goto);});
})();
</script>

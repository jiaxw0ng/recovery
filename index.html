<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recovery tracker (this device only)</title>
<style>
:root{
  --bg:#EDF2F2; --surface:#FFFFFF; --surface2:#F3F7F7; --ink:#16343B; --mute:#5B7378; --line:#D3DFE0;
  --tide:#2F7F86; --tide-ink:#FFFFFF; --tide-soft:#DCEEEF; --heather:#7A5C8F; --saffron:#A86F0F; --moss:#4F7F53; --warn:#A5472F;
  --band:rgba(79,127,83,.14);
  --display:ui-rounded,'SF Pro Rounded','Avenir Next','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --body:'Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E191C; --surface:#152428; --surface2:#1B2D32; --ink:#E8F1F2; --mute:#93A9AD; --line:#27393E;
    --tide:#5CB8BF; --tide-ink:#0B1A1D; --tide-soft:#1F3A3E; --heather:#B79BCB; --saffron:#E0AE4F; --moss:#86B589; --warn:#E59A82;
    --band:rgba(134,181,137,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#0E191C; --surface:#152428; --surface2:#1B2D32; --ink:#E8F1F2; --mute:#93A9AD; --line:#27393E;
  --tide:#5CB8BF; --tide-ink:#0B1A1D; --tide-soft:#1F3A3E; --heather:#B79BCB; --saffron:#E0AE4F; --moss:#86B589; --warn:#E59A82;
  --band:rgba(134,181,137,.16);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:700;margin:16px 0 8px}
p{margin:0 0 10px}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:10px 16px 150px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 6px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;stroke:var(--tide);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--saffron);display:inline-block}
.status.db i{background:var(--moss)}
.hero{padding:6px 0 4px}
.hero h1{font-size:clamp(26px,7vw,36px);font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.datenav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.datenav .nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;line-height:1}
.datenav .mid{text-align:center}
.datenav input[type=date]{width:auto;min-height:36px;margin-top:6px;font-size:14px;padding:4px 8px}
.strip{display:flex;gap:6px;margin:14px 0 4px}
.day{flex:1;min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0}
.day span{font-size:11px;color:var(--mute)}
.day b{font-family:var(--display);font-size:17px}
.day.has{background:var(--tide-soft);border-color:var(--tide)}
.day.sel{outline:2px solid var(--tide);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:14px 0 6px}
.stat{border-left:3px solid var(--tide);padding:2px 0 2px 12px}
.stat:nth-child(2){border-color:var(--heather)}
.stat:nth-child(3){border-color:var(--saffron)}
.stat:nth-child(4){border-color:var(--moss)}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.soft{background:var(--surface2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row.stack{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
label,.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.unit{font-weight:400;color:var(--mute);font-size:12px;margin-left:4px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface2);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--tide);outline-offset:2px}
.stepper{display:grid;grid-template-columns:46px 1fr 46px;gap:8px}
.stepper input{text-align:center;font-family:var(--display);font-size:22px;font-weight:700}
.step{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--tide-soft);color:var(--tide);font-size:22px;font-weight:700;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink);font-weight:600}
.chip.sm{min-height:34px;padding:0 11px;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dot{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--display);font-size:18px;font-weight:700}
.dot[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer}
.btn-primary{background:var(--tide);color:var(--tide-ink)}
.btn-quiet{background:var(--surface);border-color:var(--line)}
.btn-danger{background:transparent;color:var(--warn);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.savebar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:10px 0;z-index:5}
.savebar .btn-primary{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{min-height:40px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--tide);color:var(--tide-ink);font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{min-height:64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer;padding:0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--tide);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0;padding-top:0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-head b{font-family:var(--display);font-size:16px}
.ex-head .code{font-size:12px;color:var(--mute)}
.ex-meta{font-size:13px;color:var(--mute);margin:2px 0 8px}
.ex-hint{font-size:13px;color:var(--tide);margin:0 0 8px}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.setrow .n{font-size:13px;color:var(--mute)}
.setrow input{min-height:42px;text-align:center}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th{font-weight:600;font-size:12px;color:var(--mute);vertical-align:bottom}
thead th button{background:none;border:0;color:var(--tide);font-weight:600;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
td small{color:var(--mute);font-size:11px;margin-left:3px}
.chartwrap{margin:6px 0 4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .pt{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tip{min-height:20px;font-size:13px;color:var(--ink);margin-top:4px}
.empty{padding:22px 14px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list .l{min-width:0}
.list .l small{display:block;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--tide);font-weight:600;cursor:pointer;padding:6px 4px;font-size:14px}
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-size:20px;font-weight:400}
details[open] summary::after{content:"–"}
details .body{padding:0 0 12px;font-size:15px}
details ul{margin:0 0 8px;padding-left:20px}
details li{margin-bottom:4px}
.weektbl td,.weektbl th{white-space:normal;text-align:left;vertical-align:top}
.weektbl th{font-size:13px;color:var(--ink);width:56px}
.note{font-size:13px;color:var(--mute)}
.answer{white-space:pre-wrap;font-size:15px;line-height:1.65;margin:0}
.answer.busy{color:var(--mute)}
.preview{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin:0 0 8px;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

.sheet{--surface:#fff;--ink:#111;--mute:#444;--line:#c9c9c9;--tide:#1f6a70;--heather:#6a4a7e;--saffron:#8a5a0c;--moss:#3f6b43;--band:rgba(63,107,67,.15);background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin:12px 0;font-size:14px;line-height:1.5}
.sheet h1{font-size:22px;margin-bottom:4px}
.sheet h2{font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sheet .meta{color:var(--mute);font-size:12px;margin-bottom:6px}
.sheet .pre{margin:0}
.sheet table{min-width:0;width:100%}
.sheet th,.sheet td{white-space:normal;padding:5px 7px;font-size:12.5px;border-bottom:1px solid var(--line)}
.sheet th:first-child,.sheet td:first-child{position:static;background:transparent}
.sheet thead th{color:var(--mute)}
.sheet section{break-inside:avoid}
.sheet .tip{display:none}
.sheet ul{margin:0;padding-left:18px}
.sheet .foot{font-size:11px;color:var(--mute);margin-top:16px}
.sheet .chartwrap{max-width:560px}
details.watch{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:4px}
details.watch summary{padding:12px 0}
@media print{
  .noprint,.top,.tabbar,.toast{display:none!important}
  :root{padding:0!important}
  body{background:#fff}
  .app{max-width:none;padding:0}
  .sheet{border:0;padding:0;margin:0;font-size:11pt}
  .sheet h1{font-size:20pt}
  .sheet h2{font-size:12pt}
  @page{margin:14mm}
}

:root{--s1:47,127,134;--s2:79,139,87;--s3:168,117,15;--s4:185,83,30;--s5:168,64,47;--m1:74,85,153;--m2:107,92,153;--m3:94,116,128;--m4:122,143,58;--m5:194,122,10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:92,184,191;--s2:134,181,137;--s3:224,174,79;--s4:232,150,90;--s5:229,130,110;--m1:140,150,210;--m2:170,150,205;--m3:150,175,190;--m4:200,180,90;--m5:235,170,70}}
:root[data-theme="dark"]{--s1:92,184,191;--s2:134,181,137;--s3:224,174,79;--s4:232,150,90;--s5:229,130,110;--m1:140,150,210;--m2:170,150,205;--m3:150,175,190;--m4:200,180,90;--m5:235,170,70}
.scale{gap:6px}
.scale .dot{--c:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:82px;padding:8px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:rgba(var(--c),.62);font-family:var(--body);font-size:11px;font-weight:500}
.scale .dot svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scale .dot span{color:var(--mute);line-height:1}
.scale .dot[aria-pressed="true"]{background:rgba(var(--c),.16);border:2px solid rgb(var(--c));color:rgb(var(--c))}
.scale .dot[aria-pressed="true"] span{color:var(--ink);font-weight:600}
.scale .dot.stress.lv1{--c:var(--s1)}.scale .dot.stress.lv2{--c:var(--s2)}.scale .dot.stress.lv3{--c:var(--s3)}.scale .dot.stress.lv4{--c:var(--s4)}.scale .dot.stress.lv5{--c:var(--s5)}
.scale .dot.mood.lv1{--c:var(--m1)}.scale .dot.mood.lv2{--c:var(--m2)}.scale .dot.mood.lv3{--c:var(--m3)}.scale .dot.mood.lv4{--c:var(--m4)}.scale .dot.mood.lv5{--c:var(--m5)}
.scale-read{font-size:13px;color:var(--mute);min-height:20px;margin-top:6px}
.chip[data-tone][aria-pressed="true"]{color:var(--tide-ink)}
.chip[data-tone="moss"][aria-pressed="true"]{background:var(--moss);border-color:var(--moss)}
.chip[data-tone="saffron"][aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron)}
.chip[data-tone="tide"][aria-pressed="true"]{background:var(--tide);border-color:var(--tide)}
.chip[data-tone="heather"][aria-pressed="true"]{background:var(--heather);border-color:var(--heather)}
.card.acc-tide{border-left:4px solid var(--tide)}
.card.acc-saffron{border-left:4px solid var(--saffron)}
.card.acc-moss{border-left:4px solid var(--moss)}
.card.acc-heather{border-left:4px solid var(--heather)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--tide)}
.inl{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.ex-actions{display:flex;flex-wrap:wrap;gap:2px 16px}
.swap{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.edrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.edrow .nm{grid-column:1/-1}
.edrow label{font-size:12px;margin-bottom:4px}
.addex{border-top:1px solid var(--line)}
.sheet .intro{margin:6px 0 4px;font-size:14px}

.medrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.medrow:last-child{border-bottom:0}
.medrow .nm{min-width:0}.medrow .nm b{font-weight:600}.medrow .nm small{display:block;color:var(--mute);font-size:12px}
.medrow .tg{display:flex;gap:6px;flex-shrink:0}
.tgl{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.tgl[data-v="1"][aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--tide-ink);font-weight:600}
.tgl[data-v="0"][aria-pressed="true"]{background:var(--mute);border-color:var(--mute);color:var(--tide-ink);font-weight:600}
.chip em{font-style:normal;color:var(--mute);font-size:11px;margin-left:4px}
.chip[data-tone="warn"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--tide-ink)}
.list .acts{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.mapwrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:420px;margin:8px auto 4px}
.maplbl{text-align:center;font-size:12px;color:var(--mute)}
.bodymap{width:100%;height:auto;display:block}
.bodymap .sil{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.bodymap .sil-l{stroke:var(--surface2);stroke-linecap:round;fill:none}
.bodymap .mm{fill:var(--line)}
.bodymap .mm.p{fill:var(--tide)}
.bodymap .mm.s{fill:var(--saffron)}
.maplegend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute);margin:6px 0 12px;flex-wrap:wrap}
.lg{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lg.p{background:var(--tide)}.lg.s{background:var(--saffron)}.lg.n{background:var(--line)}
.mapcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mapcols h3{margin-top:0}
.mlist{list-style:none;margin:0;padding:0;font-size:14px}
.mlist li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.mlist li b{font-weight:500;color:var(--mute);font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19c3-5 6-8 10-10"/></svg>Recovery tracker</div>
    <span class="status" id="status" aria-live="polite"><i></i><span>On this device only</span></span>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" aria-label="Sections"><div class="tabbar-inner" id="tabbar"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,el)=> (el||document).querySelector(s);
const $$=(s,el)=> Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtLong=s=>parseD(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

const COLS=['daily','labs','measures','workouts','scans','profile','cardio','programs','meds'];
const S={};COLS.forEach(c=>{S[c]={};});
const LS_KEY='recovery.v1';
let storageOK=true;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||'{}');COLS.forEach(c=>{S[c]=j[c]||{};});}catch(e){storageOK=false;}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){storageOK=false;setStatus();return false;}}
async function put(col,id,data){S[col][id]=clean(data);if(!saveLocal())throw new Error('storage');onData(col);}
async function remove(col,id){delete S[col][id];if(!saveLocal())throw new Error('storage');onData(col);}
function setStatus(){
  const el=$('#status');
  el.className='status';
  el.innerHTML='<i></i><span>'+(storageOK?'On this device only':'Can’t save here. Use a normal browser window.')+'</span>';
}
try{localStorage.setItem('recovery.test','1');localStorage.removeItem('recovery.test');}catch(e){storageOK=false;}
loadLocal();
const SEED=/*SEED_JSON*/null;
function applySeed(){
  let n=0;if(!SEED)return 0;
  COLS.forEach(c=>{
    const m=SEED[c];if(!m)return;
    Object.keys(m).forEach(id=>{
      if(c==='profile'&&id==='summary'){
        const cur=S.profile.summary,sp=m[id],prev=SEED.prev||{};
        if(!cur){S.profile.summary=JSON.parse(JSON.stringify(sp));n++;return;}
        const next=Object.assign({},cur);let ch=false;
        Object.keys(sp).forEach(k=>{
          if(k==='ts')return;
          const cv=cur[k],sv=sp[k],blank=cv==null||cv===''||(typeof cv==='number'&&isNaN(cv));
          if((blank&&sv!==''&&sv!=null)||(prev[k]!=null&&cv===prev[k]&&sv!==cv)){next[k]=sv;ch=true;}
        });
        if(ch){S.profile.summary=next;n++;}
        return;
      }
      if(!S[c][id]){S[c][id]=JSON.parse(JSON.stringify(m[id]));n++;}
    });
  });
  if(n)saveLocal();
  return n;
}
function seedIfFirstRun(){
  if(!SEED)return;
  try{
    const v=localStorage.getItem('recovery.seeded'),cur=String(SEED.v||1);
    if(v===cur)return;
    const empty=COLS.every(c=>Object.keys(S[c]).length===0);
    if(!v){if(empty)applySeed();}          /* brand-new install: load the starter data; never touch existing entries */
    else if(!empty){applySeed();}          /* earlier starter install: add what is new, never resurrect erased data */
    localStorage.setItem('recovery.seeded',cur);
  }catch(e){}
}
seedIfFirstRun();
function nudgeHTML(){
  let n=0;COLS.forEach(c=>{n+=Object.keys(S[c]).length;});
  if(n<5)return '';
  let last=null;try{last=localStorage.getItem('recovery.lastBackup');}catch(e){}
  const days=last?Math.floor((Date.now()-new Date(last).getTime())/86400000):null;
  if(days!=null&&days<14)return '';
  return '<div class="card soft" style="margin:10px 0"><p style="margin:0 0 8px">'+(days==null?'You haven’t backed up this device’s data yet.':'It’s been '+days+' days since your last backup.')+' If the browser’s data is cleared, entries can’t be recovered.</p><button type="button" class="btn btn-quiet sm" data-goto="plan">Go to backup</button></div>';
}
async function downloadFile(name,text){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:name,data:text});return true;}
    }
  }catch(e){if(e&&e.code==='declined')return false;}
  const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  return true;
}

/* ---------- charts ---------- */
function niceTicks(min,max,n){
  const span=(max-min)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag,out=[];
  for(let v=Math.ceil(min/step-1e-9)*step;v<=max+step*0.001;v+=step)out.push(+v.toFixed(6));
  return out;
}
function lineChart(o){
  const all=o.series.reduce((a,s)=>a.concat(s.pts),[]);
  if(!all.length)return '<div class="empty">'+esc(o.empty||'Nothing logged yet.')+'</div>';
  const W=360,H=o.h||190,L=38,R=12,T=12,B=26;
  const xs=all.map(p=>parseD(p.d).getTime());
  let x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  if(x0===x1){x0-=86400000*3;x1+=86400000*3;}
  let y0=o.yMin,y1=o.yMax;
  if(y0==null||y1==null){
    const v=all.map(p=>p.v);let lo=Math.min.apply(null,v),hi=Math.max.apply(null,v);
    const pd=(hi-lo)*0.2||Math.max(0.5,Math.abs(hi)*0.05);
    if(y0==null)y0=lo-pd;if(y1==null)y1=hi+pd;
  }
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">';
  if(o.band){const a=Math.max(o.band.from,y0),b=Math.min(o.band.to,y1);if(b>a)svg+='<rect x="'+L+'" y="'+Y(b)+'" width="'+(W-L-R)+'" height="'+(Y(a)-Y(b))+'" fill="var(--band)"/><text x="'+(L+4)+'" y="'+(Y(b)+11)+'">'+esc(o.band.label)+'</text>';}
  niceTicks(y0,y1,4).forEach(t=>{if(t<y0-1e-9||t>y1+1e-9)return;svg+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text x="'+(L-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+(+t.toFixed(2))+'</text>';});
  if(o.guide&&o.guide.v>=y0&&o.guide.v<=y1)svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.guide.v)+'" y2="'+Y(o.guide.v)+'" stroke="var(--saffron)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(Y(o.guide.v)-4)+'" text-anchor="end">'+esc(o.guide.label)+'</text>';
  const dset=Array.from(new Set(all.map(p=>p.d))).sort();
  const nl=Math.min(4,dset.length);
  for(let i=0;i<nl;i++){
    const d=dset[nl===1?0:Math.round(i*(dset.length-1)/(nl-1))];
    const anchor=i===0&&nl>1?'start':i===nl-1&&nl>1?'end':'middle';
    svg+='<text x="'+X(parseD(d).getTime())+'" y="'+(H-8)+'" text-anchor="'+anchor+'">'+esc(fmtShort(d))+'</text>';
  }
  o.series.forEach(s=>{
    const pts=s.pts.slice().sort((a,b)=>a.d<b.d?-1:1);
    if(pts.length>1)svg+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>X(parseD(p.d).getTime()).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'"/>';
    pts.forEach(p=>{
      const tip=fmtMon(p.d)+' · '+s.name+' '+(p.open?'<':'')+(+p.v.toFixed(2))+(o.unit?(' '+o.unit):'');
      svg+='<circle class="pt" data-tip="'+esc(tip)+'" cx="'+X(parseD(p.d).getTime()).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(p.open?4.2:3.6)+'" fill="'+(p.open?'var(--surface)':s.color)+'" stroke="'+s.color+'" stroke-width="2"><title>'+esc(tip)+'</title></circle>';
    });
  });
  svg+='</svg>';
  const legend=o.series.length>1||o.legend?'<div class="legend">'+o.series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'';
  return '<div class="chartwrap">'+svg+legend+'<div class="tip" aria-live="polite">Tap a point for its value.</div></div>';
}

function guessMuscles(name){

  else if(has('squat')||has('lunge')||has('leg press')||has('step-up')||has('step up')){out.p=['quads','glutes'];out.s=['hamstrings','adductors'];}
  else if(has('deadlift')||has('rdl')||has('hip thrust')||has('bridge')&&!has('side')||has('good morning')||has('pull-through')){out.p=['glutes','hamstrings'];out.s=['lower_back'];}

  else if(has('shoulder press')||has('overhead')||has('military')||has('arnold')){out.p=['shoulders_front','shoulders_side'];out.s=['triceps','upper_back'];}
  else if(has('lateral raise')||has('side raise')){out.p=['shoulders_side'];}
  else if(has('rear delt')||has('reverse fly')||has('face pull')){out.p=['shoulders_rear','upper_back'];}

  else if(has('row')){out.p=['upper_back','lats'];out.s=['biceps','shoulders_rear','forearms'];}
  else if(has('triceps')||has('dip')||has('skull')){out.p=['triceps'];}
  else if(has('curl')){out.p=['biceps'];out.s=['forearms'];}
  else if(has('side bridge')||has('side plank')||has('woodchop')||has('pallof')||has('oblique')||has('carry')){out.p=['obliques'];out.s=['abs'];}
  else if(has('crunch')||has('leg raise')||has('plank')||has('sit-up')||has('situp')||has('dead bug')||has('rollout')){out.p=['abs'];out.s=['obliques'];}

function altList(name,eq){

const FLOW_RANK={spot:1,light:2,medium:3,heavy:4},FLOW_L={spot:'Spotting',light:'Light',medium:'Medium',heavy:'Heavy'};
const BLEED=[['spot','Spotting'],['light','Light'],['medium','Medium'],['heavy','Heavy']];
function bleedEpisodes(){
  const ds=Object.keys(S.daily).filter(d=>S.daily[d].bleed).sort(),eps=[];
  ds.forEach(d=>{
    const e=S.daily[d],r=FLOW_RANK[e.bleed]||1,last=eps[eps.length-1];
    if(last&&addDays(last.end,1)>=d){last.end=d;last.days++;last.max=Math.max(last.max,r);last.med=last.med||!!e.bleedMed;}
    else eps.push({start:d,end:d,days:1,max:r,med:!!e.bleedMed});
  });
  return eps;
}
const flowName=r=>FLOW_L[Object.keys(FLOW_RANK).filter(k=>FLOW_RANK[k]===r)[0]]||'';

function makeTrain(){
  let root,mode='strength',list=[],note='',editor=null,delArmed=false,delTimer=null,cType='Easy walk',cEffort='easy';
  const wid=()=>trainDate+'-'+trainCycle;

  /* ----- history and hints ----- */
  function lastFor(name){
    const ids=Object.keys(S.workouts).sort().reverse();
    for(let i=0;i<ids.length;i++){
      const w=S.workouts[ids[i]];
      if(ids[i]===wid())continue;
      const sets=w.ex&&w.ex[name];
      if(sets&&sets.some(s=>s.w!=null||s.r!=null))return {date:w.date,sets:sets};
    }
    return null;
  }
  function hintText(ex){
    const last=lastFor(ex.n);
    if(!last)return 'First time logging this one. Start where the last rep leaves 2–3 in reserve.';
    const txt=last.sets.filter(s=>s.r!=null||s.w!=null).map(s=>(s.w!=null?s.w+'×':'')+(s.r!=null?s.r:'')).join(', ');
    const top=ex.time?ex.time[1]:(ex.reps?ex.reps[1]:null);
    const allTop=top!=null&&last.sets.length&&last.sets.every(s=>s.r!=null&&s.r>=top);
    let next;
    if(isTimeUnit(ex.unit))next='hold a little longer than last time';
    else if(top==null)next='try one more rep, or a little more weight';
    else if(allTop)next='every set hit the top. Add '+(ex.lower?'2.5–5':'1–2.5')+' kg and drop back to '+ex.reps[0]+' reps';
    else next='aim for one more rep per set at the same weight';
    return 'Last ('+fmtShort(last.date)+'): '+txt+'. Next: '+next+'.';
  }

  /* ----- session list ----- */
  function loadSession(){
    const b=blockById(trainCycle);trainCycle=b.id;
    const cur=S.workouts[wid()];
    const base=(cur&&cur.list&&cur.list.length)?cur.list:b.ex;
    list=base.map(e=>Object.assign({},normEx(e),{_sets:(cur&&cur.ex&&cur.ex[e.n])||[]}));
    if(cur&&cur.ex)Object.keys(cur.ex).forEach(n=>{if(!list.some(e=>e.n===n))list.push({n:n,c:'+',sets:cur.ex[n].length||1,unit:'reps',_sets:cur.ex[n]});});
    note=(cur&&cur.note)||'';
  }
  function captureDraft(){
    $$('.ex[data-i]',root).forEach(el=>{
      const i=parseInt(el.dataset.i,10);if(!list[i])return;
      const sets=[];
      $$('.setrow',el).forEach(r=>{sets.push({w:num($('[data-w]',r).value),r:num($('[data-r]',r).value)});});
      list[i]._sets=sets;
    });
    const nt=$('#t-note',root);if(nt)note=nt.value;
  }
  function setRow(s,v,unit){
    return '<div class="setrow"><span class="n">Set '+(s+1)+'</span><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" aria-label="Weight in kg, set '+(s+1)+'" data-w value="'+(v&&v.w!=null?v.w:'')+'"><input type="number" inputmode="numeric" min="0" placeholder="'+esc(unit)+'" aria-label="'+esc(unit)+', set '+(s+1)+'" data-r value="'+(v&&v.r!=null?v.r:'')+'"></div>';
  }
  function unitSelect(id,cur){return '<select id="'+id+'" aria-label="Counted in">'+UNITS.map(u=>'<option value="'+u[0]+'"'+(u[0]===cur?' selected':'')+'>'+esc(u[1])+'</option>').join('')+'</select>';}
  function suggChips(i,eq){
    const ex=list[i];if(!ex)return '';

  }
  function swapPanel(ex,i){
    const mu=musclesOf(ex.n),tag=mu.p.length?mu.p.map(g=>(MG[g]||g).toLowerCase()).join(' and '):'';
    return '<div class="swap" data-swap-panel="'+i+'" hidden><p class="hint" style="margin:0 0 8px">For this session only'+(tag?'. Suggestions work the same muscles: '+esc(tag)+'.':'.')+'</p>'+
      '<div class="chips" style="margin-bottom:8px"><button type="button" class="chip sm" data-eqf="" data-i="'+i+'" aria-pressed="true">Any equipment</button>'+EQUIP.map(q=>'<button type="button" class="chip sm" data-eqf="'+q+'" data-i="'+i+'" aria-pressed="false">'+q+'</button>').join('')+'</div>'+
      '<div class="chips" style="margin-bottom:10px" data-sugg="'+i+'">'+suggChips(i,'')+'</div>'+
      '<div class="field"><label for="sw-n-'+i+'">Exercise name</label><input id="sw-n-'+i+'" type="text" list="exlib" autocomplete="off" placeholder="Type any exercise" value=""></div>'+
      '<div class="field"><label for="sw-u-'+i+'">Counted in</label>'+unitSelect('sw-u-'+i,ex.unit)+'</div>'+

      '<p class="note" style="margin-top:8px">To change it for good, copy this block and edit the copy.</p></div>';
  }
  function cardHTML(ex,i){
    const unit=ex.unit||'reps',saved=ex._sets||[],n=Math.max(ex.sets||1,saved.length);
    const target=ex.time?(ex.time[0]+'–'+ex.time[1]+' '+unit):(ex.reps?(ex.reps[0]+'–'+ex.reps[1]+' '+unit):('counted in '+unit));
    const meta=target+(ex.tempo?' · tempo '+ex.tempo:'')+(ex.rest?' · rest '+ex.rest:'');
    let sets='';for(let s=0;s<n;s++)sets+=setRow(s,saved[s],unit);

      '<div class="ex-meta">'+esc(meta)+'</div><div class="ex-hint" data-hint="'+i+'">'+esc(hintText(ex))+'</div>'+
      '<div class="sets" data-sets="'+i+'">'+sets+'</div>'+
      '<div class="ex-actions"><button type="button" class="linkbtn" data-addset="'+i+'">+ Add a set</button><button type="button" class="linkbtn" data-swap="'+i+'">Swap exercise</button><button type="button" class="linkbtn" data-skip="'+i+'">Skip today</button></div>'+
      swapPanel(ex,i)+'</div>';

  function addExHTML(){
    return '<div class="ex addex"><button type="button" class="linkbtn" data-addex>+ Add another exercise to today</button>'+
      '<div class="swap" id="addPanel" hidden><div class="field"><label for="ax-n">Exercise name</label><input id="ax-n" type="text" list="exlib" autocomplete="off" placeholder="Type or pick one"></div>'+
      '<div class="row stack"><div class="field"><label for="ax-u">Counted in</label>'+unitSelect('ax-u','reps')+'</div><div class="field"><label for="ax-s">Sets</label><input id="ax-s" type="number" inputmode="numeric" min="1" max="10" value="2"></div></div>'+

  function renderCards(){const el=$('#exlist',root);if(el)el.innerHTML=cardsHTML();}

  /* ----- blocks ----- */
  function blockOptions(){return allBlocks().map(b=>'<option value="'+esc(b.id)+'"'+(b.id===trainCycle?' selected':'')+'>'+esc(b.label)+(b.builtin?'':' (yours)')+'</option>').join('');}
  function edRow(r,i){

      '<div class="nm" style="display:flex;justify-content:space-between;align-items:center"><label class="inl" style="margin:0"><input type="checkbox" data-f="lower"'+(r.lower?' checked':'')+'> Lower-body lift</label><button type="button" class="linkbtn" data-edrm="'+i+'" style="color:var(--warn)">Remove</button></div></div>';

  function editorHTML(){
    if(!editor)return '';
    return '<div class="card acc-heather"><h2>'+(editor.id?'Edit block':'New block')+'</h2>'+
      '<div class="field"><label for="ed-name">Block name</label><input id="ed-name" type="text" value="'+esc(editor.name)+'" placeholder="For example: Weeks 13–16"></div>'+
      '<div id="edrows">'+editor.rows.map(edRow).join('')+'</div>'+

      '<p class="note" style="margin-top:10px">“From” and “To” are your target range, such as 6 to 8 reps or 30 to 60 seconds. Leave them blank for no target.</p>'+
      '<div class="savebar" style="position:static;padding:10px 0 0"><button type="button" class="btn btn-primary" id="edSave">Save block</button><button type="button" class="btn btn-quiet" id="edCancel">Cancel</button></div></div>';
  }
  function readEditor(){
    editor.name=$('#ed-name',root).value;
    editor.rows=$$('.edrow',root).map(el=>{const g=f=>$('[data-f="'+f+'"]',el);return {n:g('n').value.trim(),sets:g('sets').value,lo:g('lo').value,hi:g('hi').value,unit:g('unit').value,lower:g('lower').checked};});

  function openEditor(src,id){
    editor={id:id||null,name:id?src.label:'Copy of '+(src?src.label:'block'),rows:[]};
    const ex=(src&&src.ex)||[];
    editor.rows=ex.map(e0=>{const e=normEx(e0),t=e.time||e.reps||[];return {n:e.n,sets:e.sets||2,lo:t[0]!=null?t[0]:'',hi:t[1]!=null?t[1]:'',unit:e.unit,lower:!!e.lower};});
    if(!editor.rows.length)editor.rows=[{n:'',sets:2,lo:'',hi:'',unit:'reps',lower:false}];
    if(!id&&!src)editor.name='';
    const h=$('#editorHost',root);if(h){h.innerHTML=editorHTML();h.scrollIntoView({behavior:'smooth',block:'start'});}
  }

  /* ----- cardio ----- */
  function cardioWeek(){
    const cut=addDays(today(),-6),ids=Object.keys(S.cardio).filter(id=>S.cardio[id].date>=cut);
    const mins=ids.reduce((a,id)=>a+(S.cardio[id].min||0),0);
    return ids.length?('Last 7 days: '+mins+' min across '+ids.length+' session'+(ids.length===1?'':'s')+'.'):'Nothing logged in the last 7 days.';
  }
  function cardioRecent(){
    const ids=Object.keys(S.cardio).sort().reverse().slice(0,10);
    if(!ids.length)return '<div class="empty">No cardio or walks logged yet.</div>';
    return '<ul class="list">'+ids.map(id=>{const c=S.cardio[id];
      const bits=[c.min!=null?c.min+' min':'',c.km!=null?c.km+' km':'',c.kg?('+'+c.kg+' kg'):'',c.effort?(EFFORTS.filter(e=>e[0]===c.effort)[0]||[0,c.effort])[1].toLowerCase():''].filter(Boolean).join(' · ');
      return '<li><div class="l"><b>'+esc(fmtLong(c.date))+'</b><small>'+esc(c.type||'Cardio')+(bits?' · '+esc(bits):'')+(c.note?' · '+esc(c.note):'')+'</small></div><button type="button" class="linkbtn" data-delc="'+esc(id)+'" style="color:var(--warn)">Delete</button></li>';}).join('')+'</ul>';
  }
  function cardioHTML(){
    return '<div class="card acc-moss"><h2>Log a walk or cardio session</h2>'+
      '<div class="field"><label for="c-date">Date</label><input type="date" id="c-date" value="'+trainDate+'" max="'+today()+'"></div>'+
      '<div class="field"><span class="lbl">What was it</span><div class="chips" id="ctypes">'+CARDIO_TYPES.map(t=>'<button type="button" class="chip" data-ctype="'+esc(t)+'" data-tone="moss" aria-pressed="'+(t===cType)+'">'+esc(t)+'</button>').join('')+'</div></div>'+
      '<div class="row"><div class="field"><label for="c-min">Minutes</label><input id="c-min" type="number" inputmode="numeric" min="0" max="600"></div><div class="field"><label for="c-km">Distance<span class="unit">km, optional</span></label><input id="c-km" type="number" inputmode="decimal" step="0.01" min="0"></div></div>'+
      '<div class="field"><label for="c-kg">Added weight<span class="unit">kg, for a weighted vest or pack</span></label><input id="c-kg" type="number" inputmode="decimal" step="0.5" min="0" placeholder="Leave blank for none"></div>'+
      '<div class="field"><span class="lbl">How it felt</span><div class="chips" id="ceff">'+EFFORTS.map(e=>'<button type="button" class="chip" data-ceff="'+e[0]+'" data-tone="tide" aria-pressed="'+(e[0]===cEffort)+'">'+esc(e[1])+'</button>').join('')+'</div><p class="hint">Zone 2 is the “can still chat” pace.</p></div>'+
      '<div class="field"><label for="c-note">Note</label><input id="c-note" type="text" placeholder="Route, incline, how your legs felt"></div>'+
      '<button type="button" class="btn btn-primary" id="saveCardio">Save cardio</button></div>'+
      '<div class="card"><h2>Recent cardio</h2><p class="note" id="cweek">'+esc(cardioWeek())+'</p><div id="crecent">'+cardioRecent()+'</div></div>';
  }

  /* ----- main render ----- */
  function muscleHostHTML(){
    const doc=S.workouts[wid()];
    return doc?muscleCardHTML(tallyMuscles(sessionEntries(doc)),'Muscles worked in this session','Based on the sets you saved.'):'';
  }
  function recentHTML(){
    const ids=Object.keys(S.workouts).sort().reverse().slice(0,8);
    if(!ids.length)return '<div class="empty">No sessions logged yet. Your first one will show up here.</div>';
    return '<ul class="list">'+ids.map(id=>{
      const w=S.workouts[id],n=Object.keys(w.ex||{}).length,b=allBlocks().filter(x=>x.id===w.cycle)[0];
      return '<li><div class="l"><b>'+esc(fmtLong(w.date))+'</b><small>'+esc(b?b.label:'Custom block')+' · '+n+' exercise'+(n===1?'':'s')+' logged</small></div><div><button type="button" class="linkbtn" data-open="'+esc(id)+'">Open</button><button type="button" class="linkbtn" data-del="'+esc(id)+'" style="color:var(--warn)">Delete</button></div></li>';
    }).join('')+'</ul>';
  }
  function strengthHTML(){
    const b=blockById(trainCycle);
    return '<div class="card acc-tide"><div class="row stack"><div class="field"><label for="t-date">Date</label><input type="date" id="t-date" value="'+trainDate+'" max="'+today()+'"></div>'+
      '<div class="field"><label for="blockSel">Block</label><select id="blockSel">'+blockOptions()+'</select></div></div>'+
      '<div class="chips"><button type="button" class="chip sm" id="blkNew">New block</button><button type="button" class="chip sm" id="blkCopy">Copy this block</button>'+(b.builtin?'':'<button type="button" class="chip sm" id="blkEdit">Edit this block</button><button type="button" class="chip sm" id="blkDel">Delete this block</button>')+'</div>'+
      '<details style="margin-top:10px"><summary>What comes after Weeks 9–12?</summary><div class="body"><ul><li><b>Restart heavier:</b> copy Weeks 1–4 and run it again. Your logged weights follow each exercise by name, so the hints pick up where you left off.</li><li><b>Rotate a few lifts:</b> keep the pattern, change the variation. Swap two or three exercises, not all of them at once.</li><li><b>Reset week:</b> one lighter week (one set fewer per lift) between blocks.</li><li>Equipment busy or missing? Use <b>Swap exercise</b> on that card for today.</li></ul></div></details></div>'+
      '<div id="editorHost">'+editorHTML()+'</div>'+
      '<div class="card" id="exlist">'+cardsHTML()+'</div>'+
      '<datalist id="exlib">'+ALL_EX.map(x=>'<option value="'+esc(x)+'"></option>').join('')+'</datalist>'+
      '<div class="card"><div class="field"><label for="t-note">Session note</label><textarea id="t-note" placeholder="How it felt, anything to adjust next time.">'+esc(note)+'</textarea></div></div>'+
      '<div class="savebar"><button type="button" class="btn btn-primary" id="saveWorkout">Save session</button></div>'+
      '<div id="muscleHost">'+muscleHostHTML()+'</div>'+
      '<div class="card"><h2>Recent sessions</h2><div id="recent">'+recentHTML()+'</div></div>';

  function renderAll(){
    root.innerHTML='<section class="hero"><h1>Train</h1><div class="sub">Full body each session. Alternate A1 and A2, then B1 and B2, then the C block. Short on time: one lower-body lift, one push, one pull, then core.</div></section>'+
      '<div style="margin:12px 0">'+segHTML('trainMode',[['strength','Strength'],['cardio','Cardio and walks']],mode)+'</div>'+
      '<div id="panel">'+(mode==='strength'?strengthHTML():cardioHTML())+'</div>';
  }
  function readSession(){
    captureDraft();
    const ex={},lst=[];
    list.forEach(e=>{
      const sets=(e._sets||[]).filter(s=>s.w!=null||s.r!=null);
      const c=Object.assign({},e);delete c._sets;lst.push(c);
      if(sets.length)ex[e.n]=sets;
    });
    return {date:trainDate,cycle:trainCycle,list:lst,ex:ex,note:(note||'').trim()||null,ts:Date.now()};
  }

  return {
    mount(r){
      root=r;loadSession();renderAll();
      root.addEventListener('change',function(ev){
        const id=ev.target.id;
        if(id==='t-date'&&ev.target.value&&ev.target.value<=today()){trainDate=ev.target.value;loadSession();renderAll();return;}
        if(id==='c-date'&&ev.target.value&&ev.target.value<=today()){trainDate=ev.target.value;return;}
        if(id==='blockSel'){trainCycle=ev.target.value;try{localStorage.setItem('recovery.cycle',trainCycle);}catch(e){}loadSession();renderAll();}
      });
      root.addEventListener('click',async function(ev){
        const t=ev.target;
        const md=t.closest('#trainMode button');
        if(md){captureDraft();mode=md.dataset.v;renderAll();return;}
        /* cardio */
        const ct=t.closest('[data-ctype]');if(ct){cType=ct.dataset.ctype;$$('[data-ctype]',root).forEach(b=>b.setAttribute('aria-pressed',String(b===ct)));return;}
        const ce=t.closest('[data-ceff]');if(ce){const was=ce.getAttribute('aria-pressed')==='true';$$('[data-ceff]',root).forEach(b=>b.setAttribute('aria-pressed','false'));cEffort=was?null:ce.dataset.ceff;if(!was)ce.setAttribute('aria-pressed','true');return;}
        const dc=t.closest('[data-delc]');if(dc){try{await remove('cardio',dc.dataset.delc);toast('Deleted');}catch(e){toast('Couldn’t delete that entry.');}return;}
        if(t.id==='saveCardio'){
          const d=$('#c-date',root).value||today(),mins=num($('#c-min',root).value);
          if(mins==null){toast('Add the minutes first.');return;}
          const c={date:d,type:cType,min:mins,km:num($('#c-km',root).value),kg:num($('#c-kg',root).value),effort:cEffort,note:$('#c-note',root).value.trim()||null,ts:Date.now()};
          try{await put('cardio',d+'-'+Date.now().toString(36),c);['c-min','c-km','c-kg','c-note'].forEach(i=>{$('#'+i,root).value='';});toast('Cardio saved');}
          catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
          return;
        }
        /* blocks */
        if(t.id==='blkNew'){openEditor(null,null);return;}
        if(t.id==='blkCopy'){openEditor(blockById(trainCycle),null);return;}
        if(t.id==='blkEdit'){openEditor(blockById(trainCycle),trainCycle);return;}
        if(t.id==='blkDel'){
          if(!delArmed){delArmed=true;t.textContent='Tap again to delete';clearTimeout(delTimer);delTimer=setTimeout(()=>{delArmed=false;t.textContent='Delete this block';},4000);return;}
          delArmed=false;const id=trainCycle;
          try{await remove('programs',id);trainCycle='1-4';loadSession();renderAll();toast('Block deleted. Logged sessions are kept.');}catch(e){toast('Couldn’t delete that block.');}
          return;
        }
        if(t.id==='edAdd'){readEditor();editor.rows.push({n:'',sets:2,lo:'',hi:'',unit:'reps',lower:false});$('#editorHost',root).innerHTML=editorHTML();return;}
        const er=t.closest('[data-edrm]');if(er){readEditor();editor.rows.splice(parseInt(er.dataset.edrm,10),1);if(!editor.rows.length)editor.rows.push({n:'',sets:2,lo:'',hi:'',unit:'reps',lower:false});$('#editorHost',root).innerHTML=editorHTML();return;}
        if(t.id==='edCancel'){editor=null;$('#editorHost',root).innerHTML='';return;}
        if(t.id==='edSave'){
          readEditor();
          const name=editor.name.trim(),rows=editor.rows.filter(r=>r.n);
          if(!name){toast('Give the block a name.');return;}
          if(!rows.length){toast('Add at least one exercise.');return;}
          const ex=rows.map((r,i)=>{
            const lo=num(r.lo),hi=num(r.hi),o={n:r.n,c:'#'+(i+1),sets:Math.max(1,parseInt(r.sets,10)||2),unit:r.unit,lower:!!r.lower};
            if(lo!=null||hi!=null){const a=lo!=null?lo:hi,b=hi!=null?hi:lo;if(isTimeUnit(r.unit))o.time=[a,b];else o.reps=[a,b];}
            return o;
          });
          const id=editor.id||('c-'+Date.now().toString(36)),prev=S.programs[id];
          try{await put('programs',id,{name:name,ex:ex,ts:prev&&prev.ts?prev.ts:Date.now()});trainCycle=id;try{localStorage.setItem('recovery.cycle',id);}catch(e){}editor=null;loadSession();renderAll();toast('Block saved');}
          catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
          return;
        }
        /* session cards */
        const ad=t.closest('[data-addset]');
        if(ad){const i=parseInt(ad.dataset.addset,10),box=$('[data-sets="'+i+'"]',root),n=$$('.setrow',box).length;box.insertAdjacentHTML('beforeend',setRow(n,null,list[i].unit||'reps'));return;}
        const sw=t.closest('[data-swap]');
        if(sw){const p=$('[data-swap-panel="'+sw.dataset.swap+'"]',root);if(p)p.hidden=!p.hidden;return;}
        const sc=t.closest('[data-swapclose]');if(sc){const p=$('[data-swap-panel="'+sc.dataset.swapclose+'"]',root);if(p)p.hidden=true;return;}
        const ef=t.closest('[data-eqf]');
        if(ef){const i=ef.dataset.i;$$('[data-eqf][data-i="'+i+'"]',root).forEach(b=>b.setAttribute('aria-pressed',String(b===ef)));const box=$('[data-sugg="'+i+'"]',root);if(box)box.innerHTML=suggChips(parseInt(i,10),ef.dataset.eqf);return;}
        const pk=t.closest('[data-pick]');
        if(pk){const inp=$('#sw-n-'+pk.dataset.pick,root);if(inp)inp.value=pk.dataset.name;return;}
        const ds=t.closest('[data-doswap]');
        if(ds){
          const i=parseInt(ds.dataset.doswap,10),nm=($('#sw-n-'+i,root).value||'').trim(),u=$('#sw-u-'+i,root).value;
          if(!nm){toast('Type or pick an exercise first.');return;}
          captureDraft();
          const e=list[i],changedType=isTimeUnit(e.unit)!==isTimeUnit(u);
          e.n=nm;e.unit=u;if(changedType){delete e.reps;delete e.time;}
          e.lower=lowerFor(nm);
          e.tempo=undefined;delete e.tempo;
          e._sets=[];renderCards();toast('Swapped for today');return;
        }
        const sk=t.closest('[data-skip]');
        if(sk){captureDraft();list.splice(parseInt(sk.dataset.skip,10),1);renderCards();return;}
        if(t.closest('[data-addex]')){const p=$('#addPanel',root);if(p)p.hidden=!p.hidden;return;}
        if(t.id==='closeAddEx'){$('#addPanel',root).hidden=true;return;}
        if(t.id==='doAddEx'){
          const nm=($('#ax-n',root).value||'').trim();
          if(!nm){toast('Type or pick an exercise first.');return;}
          captureDraft();
          list.push({n:nm,c:'+',sets:Math.max(1,parseInt($('#ax-s',root).value,10)||2),unit:$('#ax-u',root).value,lower:$('#ax-l',root).checked,_sets:[]});
          renderCards();toast('Added to today');return;
        }
        /* history */
        const op=t.closest('[data-open]');
        if(op){const w=S.workouts[op.dataset.open];if(w){trainDate=w.date;trainCycle=w.cycle;loadSession();renderAll();window.scrollTo(0,0);}return;}
        const dl=t.closest('[data-del]');
        if(dl){try{await remove('workouts',dl.dataset.del);toast('Session deleted');}catch(e){toast('Couldn’t delete that session.');}return;}
        if(t.id==='saveWorkout'){
          const d=readSession();
          if(!Object.keys(d.ex).length){toast('Add at least one set first.');return;}
          try{await put('workouts',wid(),d);toast('Session saved');const mh=$('#muscleHost',root);if(mh){mh.innerHTML=muscleHostHTML();mh.scrollIntoView({behavior:'smooth',block:'start'});}}
          catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
        }
      });
    },
    update(c){
      if(c==='workouts'||c==='*'){
        $$('[data-hint]',root).forEach(el=>{const e=list[parseInt(el.dataset.hint,10)];if(e)el.textContent=hintText(e);});
        const rc=$('#recent',root);if(rc)rc.innerHTML=recentHTML();
        const mh=$('#muscleHost',root);if(mh&&mode==='strength')mh.innerHTML=muscleHostHTML();
      }
      if(c==='cardio'||c==='*'){const a=$('#crecent',root),b=$('#cweek',root);if(a)a.innerHTML=cardioRecent();if(b)b.textContent=cardioWeek();}
      if(c==='programs'||c==='*'){const s=$('#blockSel',root);if(s&&!editor)s.innerHTML=blockOptions();}
    }
  };
}

function makeTrends(){
  let root,period=30;
  function inPeriod(d){return period===0||d>=addDays(today(),-period);}
  function watchCard(D,pts){
    const keys=[['sleepScore','Sleep score','var(--tide)','',0,100],['hrv','Overnight HRV','var(--heather)','ms',null,null],['rhr','Resting heart rate','var(--saffron)','bpm',null,null],['wStress','Average stress on your watch','var(--moss)','',0,100]];
    if(!D.some(e=>keys.some(k=>e[k[0]]!=null)))return '<div class="card"><h2>From your watch</h2><div class="empty">Add sleep score, HRV, resting heart rate and watch stress on the Today tab and they chart here.</div></div>';
    return '<div class="card"><h2>From your watch</h2>'+keys.map(k=>{const pp=pts(k[0]);return pp.length?('<h3>'+k[1]+'</h3>'+lineChart({label:k[1]+' over time',series:[{name:k[1],color:k[2],pts:pp}],unit:k[3],yMin:k[4],yMax:k[5],h:150})):'';}).join('')+'<p class="note">Watch numbers are estimates. Weeks of trend matter more than any single day.</p></div>';
  }
  function chartsHTML(){
    const D=Object.keys(S.daily).sort().filter(inPeriod).map(k=>Object.assign({},S.daily[k],{date:k}));
    const pts=key=>D.filter(e=>e[key]!=null).map(e=>({d:e.date,v:e[key]}));
    const bbt=lineChart({label:'Basal body temperature over time',series:[{name:'BBT',color:'var(--heather)',pts:pts('bbt')}],unit:'°C',empty:'Log your temperature on the Today tab and the trend appears here.'});
    const sleep=lineChart({label:'Hours slept over time',series:[{name:'Sleep',color:'var(--tide)',pts:pts('sleep')}],unit:'h',yMin:4,yMax:10,guide:{v:7,label:'7 h'},empty:'Hours slept will chart here.'});
    const sm=lineChart({label:'Stress and mood over time',series:[{name:'Stress',color:'var(--saffron)',pts:pts('stress')},{name:'Mood',color:'var(--moss)',pts:pts('mood')}],yMin:1,yMax:5,empty:'Stress and mood will chart here.'});
    return '<div class="card"><h2>Basal body temperature</h2>'+bbt+'<p class="note">One reading shifts a lot. Look at the direction over weeks.</p></div>'+
      '<div class="card"><h2>Sleep</h2>'+sleep+'</div>'+
      '<div class="card"><h2>Stress and mood</h2>'+sm+'</div>'+watchCard(D,pts)+bleedCardHTML()+muscleWeekCard()+eatingCardHTML();
  }
  function measureChart(){
    const ids=Object.keys(S.measures).sort(),M=ids.map(k=>Object.assign({},S.measures[k],{date:k}));
    const mk=(key,name,color)=>({name:name,color:color,pts:M.filter(m=>m[key]!=null).map(m=>({d:m.date,v:m[key]}))});
    return lineChart({label:'Body measurements over time',series:[mk('waist','Waist','var(--tide)'),mk('hip','Hip','var(--heather)'),mk('thigh','Thigh','var(--saffron)'),mk('chest','Chest','var(--moss)')].filter(s=>s.pts.length),unit:'cm',legend:true,empty:'Weekly measurements will chart here. They show more than the scale can.'});
  }
  function measHist(){
    const ids=Object.keys(S.measures).sort().reverse().slice(0,6);
    if(!ids.length)return '';
    return '<ul class="list">'+ids.map(id=>{const m=S.measures[id];
      return '<li><div class="l"><b>'+esc(fmtMon(id))+'</b><small>'+['waist','hip','thigh','chest'].filter(k=>m[k]!=null).map(k=>k+' '+m[k]).join(' · ')+(m.note?' · '+esc(m.note):'')+'</small></div><button type="button" class="linkbtn" data-delm="'+esc(id)+'" style="color:var(--warn)">Delete</button></li>';}).join('')+'</ul>';
  }
  function render(){
    root.innerHTML='<section class="hero"><h1>Trends</h1><div class="sub">Patterns over time, not scores.</div></section>'+
      '<div style="margin:12px 0">'+segHTML('periodSeg',[[14,'2 weeks'],[30,'30 days'],[90,'90 days'],[0,'All']],period)+'</div>'+
      '<div id="charts">'+chartsHTML()+'</div>'+
      '<div class="card"><h2>Weekly measurements</h2><div id="mchart">'+measureChart()+'</div>'+
      '<h3>Add measurements</h3><div class="row"><div class="field"><label for="m-date">Date</label><input type="date" id="m-date" value="'+today()+'" max="'+today()+'"></div><div></div>'+
      '<div class="field"><label for="m-waist">Waist<span class="unit">cm</span></label><input id="m-waist" type="number" inputmode="decimal" step="0.1"></div>'+
      '<div class="field"><label for="m-hip">Hip<span class="unit">cm</span></label><input id="m-hip" type="number" inputmode="decimal" step="0.1"></div>'+
      '<div class="field"><label for="m-thigh">Thigh<span class="unit">cm</span></label><input id="m-thigh" type="number" inputmode="decimal" step="0.1"></div>'+
      '<div class="field"><label for="m-chest">Chest or shoulder<span class="unit">cm</span></label><input id="m-chest" type="number" inputmode="decimal" step="0.1"></div></div>'+
      '<div class="field"><label for="m-note">How the week felt</label><input id="m-note" type="text" placeholder="Energy, stress, how clothes fit"></div>'+
      '<p class="note">Same time of day, same tape position, once a week. Daily numbers mostly show water.</p>'+
      '<button type="button" class="btn btn-primary" id="saveMeas">Save measurements</button><div id="mhist" style="margin-top:12px">'+measHist()+'</div></div>';
  }
  return {
    mount(r){
      root=r;render();
      root.addEventListener('click',async function(ev){
        const seg=ev.target.closest('#periodSeg button');
        if(seg){period=parseInt(seg.dataset.v,10);$$('#periodSeg button',root).forEach(b=>b.setAttribute('aria-pressed',String(b===seg)));$('#charts',root).innerHTML=chartsHTML();return;}
        const dm=ev.target.closest('[data-delm]');
        if(dm){try{await remove('measures',dm.dataset.delm);toast('Deleted');}catch(e){toast('Couldn’t delete that entry.');}return;}
        if(ev.target.id==='saveMeas'){
          const m={date:$('#m-date',root).value||today(),waist:num($('#m-waist',root).value),hip:num($('#m-hip',root).value),thigh:num($('#m-thigh',root).value),chest:num($('#m-chest',root).value),note:$('#m-note',root).value.trim()||null,ts:Date.now()};
          if(m.waist==null&&m.hip==null&&m.thigh==null&&m.chest==null){toast('Add at least one measurement.');return;}
          try{await put('measures',m.date,m);['waist','hip','thigh','chest','note'].forEach(k=>{$('#m-'+k,root).value='';});toast('Measurements saved');}catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
        }
      });
    },
    update(c){
      if(c==='daily'||c==='workouts'||c==='*'){const ch=$('#charts',root);if(ch)ch.innerHTML=chartsHTML();}
      if(c==='measures'||c==='*'){const a=$('#mchart',root),b=$('#mhist',root);if(a)a.innerHTML=measureChart();if(b)b.innerHTML=measHist();}
    }
  };
}

function makeLabs(){
  let root,editLab=null,editScan=null;
  const labDates=()=>Object.keys(S.labs).sort();
  function cellText(L,f){
    const v=L[f.k];if(v==null)return '—';
    return (L[f.k+'_lt']?'&lt;':'')+fnum(v)+(f.k==='ft4'&&L.ft4u?'<small>'+esc(L.ft4u)+'</small>':'');
  }
  function tableHTML(){
    const ds=labDates();
    if(!ds.length)return '<div class="empty">No results yet. Add your first panel below.</div>';
    const rows=LAB_FIELDS.filter(f=>ds.some(d=>S.labs[d][f.k]!=null));
    return '<div class="tablewrap"><table><thead><tr><th>Test</th>'+ds.map(d=>'<th><button type="button" data-editlab="'+d+'" aria-label="Edit results from '+esc(fmtMon(d))+'">'+esc(fmtMon(d))+'</button></th>').join('')+'</tr></thead><tbody>'+
      rows.map(f=>'<tr><td>'+esc(f.l)+(f.u?'<small>'+esc(f.u)+'</small>':'')+'</td>'+ds.map(d=>'<td>'+cellText(S.labs[d],f)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
      '<p class="note">Tap a date to edit that panel. A “<” means the lab reported below its detection limit.</p>';
  }
  function chartsHTML(){
    const ds=labDates(),p=k=>ds.filter(d=>S.labs[d][k]!=null).map(d=>({d:d,v:S.labs[d][k],open:!!S.labs[d][k+'_lt']}));
    const fl=lineChart({label:'FSH and LH over time',series:[{name:'FSH',color:'var(--tide)',pts:p('fsh')},{name:'LH',color:'var(--heather)',pts:p('lh')}],unit:'IU/L',yMin:0,empty:'FSH and LH will chart here once you add results.'});
    const e2=lineChart({label:'Estradiol over time',series:[{name:'Estradiol',color:'var(--saffron)',pts:p('e2')}],unit:'pmol/L',yMin:0,yMax:400,band:{from:300,to:1800,label:'Typical ovulatory range (300+)'},legend:true,empty:'Estradiol will chart here. Hollow points are “below detection” values.'});
    return '<div class="card"><h2>FSH and LH</h2>'+fl+'</div><div class="card"><h2>Estradiol</h2>'+e2+'</div>';
  }
  function labFormHTML(){
    return '<div class="card"><h2 id="labFormTitle">Add lab results</h2><div class="field"><label for="l-date">Date of test</label><input type="date" id="l-date" value="'+today()+'" max="'+today()+'"></div>'+
      '<div class="row">'+LAB_FIELDS.map(f=>'<div class="field"><label for="l-'+f.k+'">'+esc(f.l)+(f.u?'<span class="unit">'+esc(f.u)+'</span>':'')+'</label><input id="l-'+f.k+'" type="text" inputmode="decimal" placeholder="e.g. 6.3 or <88" autocomplete="off">'+
        (f.units?'<select id="l-ft4u" aria-label="Free T4 unit" style="margin-top:6px">'+f.units.map(u=>'<option>'+u+'</option>').join('')+'</select>':'')+'</div>').join('')+'</div>'+
      '<div class="field"><label for="l-note">Other tests or notes</label><textarea id="l-note" placeholder="Anything else on the report, or which lab it came from."></textarea></div>'+
      '<div class="savebar" style="position:static;padding:0"><button type="button" class="btn btn-primary" id="saveLab">Save results</button><button type="button" class="btn btn-quiet" id="cancelLab" hidden>Cancel</button><button type="button" class="btn btn-danger" id="delLab" hidden>Delete</button></div>'+
      '<p class="note" style="margin-top:8px">Type “<88” if the report says below detection. It plots as a hollow point.</p></div>';
  }
  function fillLab(d,noScroll){
    editLab=d;const L=d?S.labs[d]:null;
    $('#l-date',root).value=d||today();
    LAB_FIELDS.forEach(f=>{$('#l-'+f.k,root).value=L&&L[f.k]!=null?((L[f.k+'_lt']?'<':'')+L[f.k]):'';});
    $('#l-ft4u',root).value=(L&&L.ft4u)||'pmol/L';
    $('#l-note',root).value=(L&&L.note)||'';
    $('#labFormTitle',root).textContent=d?'Edit results from '+fmtMon(d):'Add lab results';
    $('#cancelLab',root).hidden=!d;$('#delLab',root).hidden=!d;
    if(!noScroll)$('#labFormTitle',root).scrollIntoView({behavior:'smooth',block:'start'});
  }
  function scanListHTML(){
    const ds=Object.keys(S.scans).sort().reverse();
    if(!ds.length)return '<div class="empty">No scans logged yet.</div>';
    return '<ul class="list">'+ds.map(d=>{const s=S.scans[d];
      return '<li><div class="l"><b>'+esc(fmtMon(d))+'</b><small>'+[s.endo!=null?'endometrium '+s.endo+' mm':'',s.rov!=null?'right ovary '+s.rov+' mL':'',s.lov!=null?'left ovary '+s.lov+' mL':''].filter(Boolean).join(' · ')+(s.note?'<br>'+esc(s.note):'')+'</small></div><button type="button" class="linkbtn" data-editscan="'+d+'">Edit</button></li>';}).join('')+'</ul>';
  }
  function scanFormHTML(){
    return '<h3 id="scanTitle">Add a scan</h3><div class="row"><div class="field"><label for="s-date">Date</label><input type="date" id="s-date" value="'+today()+'" max="'+today()+'"></div><div class="field"><label for="s-endo">Endometrium<span class="unit">mm</span></label><input id="s-endo" type="number" inputmode="decimal" step="0.1"></div>'+
      '<div class="field"><label for="s-rov">Right ovary<span class="unit">mL</span></label><input id="s-rov" type="number" inputmode="decimal" step="0.01"></div><div class="field"><label for="s-lov">Left ovary<span class="unit">mL</span></label><input id="s-lov" type="number" inputmode="decimal" step="0.01"></div></div>'+
      '<div class="field"><label for="s-note">Findings</label><textarea id="s-note" placeholder="Uterus size and position, follicles, anything the report flagged."></textarea></div>'+
      '<div class="savebar" style="position:static;padding:0"><button type="button" class="btn btn-primary" id="saveScan">Save scan</button><button type="button" class="btn btn-quiet" id="cancelScan" hidden>Cancel</button><button type="button" class="btn btn-danger" id="delScan" hidden>Delete</button></div>';
  }
  function fillScan(d,noScroll){
    editScan=d;const s=d?S.scans[d]:null;
    $('#s-date',root).value=d||today();$('#s-endo',root).value=s&&s.endo!=null?s.endo:'';$('#s-rov',root).value=s&&s.rov!=null?s.rov:'';$('#s-lov',root).value=s&&s.lov!=null?s.lov:'';$('#s-note',root).value=(s&&s.note)||'';
    $('#scanTitle',root).textContent=d?'Edit scan from '+fmtMon(d):'Add a scan';$('#cancelScan',root).hidden=!d;$('#delScan',root).hidden=!d;
    if(!noScroll)$('#scanTitle',root).scrollIntoView({behavior:'smooth',block:'start'});
  }
  function doctorText(){
    const ds=labDates(),rows=LAB_FIELDS.filter(f=>ds.some(d=>S.labs[d][f.k]!=null));
    let t='Lab results (oldest to newest)\n'+['Test','Unit'].concat(ds.map(fmtMon)).join('\t')+'\n';
    rows.forEach(f=>{t+=[f.l,f.u||''].concat(ds.map(d=>{const L=S.labs[d];return L[f.k]==null?'':(L[f.k+'_lt']?'<':'')+fnum(L[f.k])+(f.k==='ft4'&&L.ft4u?' '+L.ft4u:'');})).join('\t')+'\n';});
    const ss=Object.keys(S.scans).sort();
    if(ss.length){t+='\nPelvic ultrasound\n';ss.forEach(d=>{const s=S.scans[d];t+=fmtMon(d)+': '+[s.endo!=null?'endometrium '+s.endo+' mm':'',s.rov!=null?'right ovary '+s.rov+' mL':'',s.lov!=null?'left ovary '+s.lov+' mL':'',s.note||''].filter(Boolean).join('; ')+'\n';});}
    return t;
  }
  function render(){
    root.innerHTML='<section class="hero"><h1>Labs and scans</h1><div class="sub">Keep every panel in one place and see the trend.</div></section>'+
      '<div id="labcharts">'+chartsHTML()+'</div>'+
      '<div class="card"><h2>All results</h2><div id="labtable">'+tableHTML()+'</div><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-quiet sm" id="copyDoc">Copy for your doctor</button></div><div id="copyOut"></div></div>'+
      labFormHTML()+
      '<div class="card"><h2>Ultrasound</h2><div id="scanlist">'+scanListHTML()+'</div>'+scanFormHTML()+'</div>';
  }
  return {
    mount(r){
      root=r;render();
      root.addEventListener('click',async function(ev){
        const el=ev.target.closest('[data-editlab]');if(el){fillLab(el.dataset.editlab);return;}
        const es=ev.target.closest('[data-editscan]');if(es){fillScan(es.dataset.editscan);return;}
        const id=ev.target.id;
        if(id==='cancelLab'){fillLab(null);return;}
        if(id==='cancelScan'){fillScan(null);return;}
        if(id==='saveLab'){
          const date=$('#l-date',root).value||today(),doc={date:date,ts:Date.now()};let n=0;
          LAB_FIELDS.forEach(f=>{
            const raw=$('#l-'+f.k,root).value.trim();if(!raw)return;
            const v=num(raw);if(v==null)return;
            doc[f.k]=v;if(raw.charAt(0)==='<')doc[f.k+'_lt']=true;n++;
            if(f.k==='ft4')doc.ft4u=$('#l-ft4u',root).value;
          });
          const note=$('#l-note',root).value.trim();if(note)doc.note=note;
          if(!n&&!note){toast('Add at least one result first.');return;}
          try{
            await put('labs',date,doc);
            if(editLab&&editLab!==date)await remove('labs',editLab);
            fillLab(null,true);toast('Results saved');
          }catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
          return;
        }
        if(id==='delLab'&&editLab){try{await remove('labs',editLab);fillLab(null,true);toast('Panel deleted');}catch(e){toast('Couldn’t delete that panel.');}return;}
        if(id==='saveScan'){
          const date=$('#s-date',root).value||today(),doc={date:date,endo:num($('#s-endo',root).value),rov:num($('#s-rov',root).value),lov:num($('#s-lov',root).value),note:$('#s-note',root).value.trim()||null,ts:Date.now()};
          if(doc.endo==null&&doc.rov==null&&doc.lov==null&&!doc.note){toast('Add a measurement or finding first.');return;}
          try{await put('scans',date,doc);if(editScan&&editScan!==date)await remove('scans',editScan);fillScan(null,true);toast('Scan saved');}catch(e){console.warn(e);toast('Couldn’t save on this device. Check that private browsing is off and there is free space.');}
          return;
        }
        if(id==='delScan'&&editScan){try{await remove('scans',editScan);fillScan(null,true);toast('Scan deleted');}catch(e){toast('Couldn’t delete that scan.');}return;}
        if(id==='copyDoc'){
          const t=doctorText(),out=$('#copyOut',root);
          try{await navigator.clipboard.writeText(t);toast('Copied');out.innerHTML='';}
          catch(e){out.innerHTML='<p class="note" style="margin-top:10px">Select all and copy:</p><textarea class="mono" readonly rows="8" id="copyTa">'+esc(t)+'</textarea>';const ta=$('#copyTa',root);if(ta)ta.select();}
        }
      });
    },
    update(c){
      if(c==='labs'||c==='*'){const a=$('#labcharts',root),b=$('#labtable',root);if(a)a.innerHTML=chartsHTML();if(b)b.innerHTML=tableHTML();}
      if(c==='scans'||c==='*'){const s=$('#scanlist',root);if(s)s.innerHTML=scanListHTML();}
    }
  };
}

    '<details><summary>School-night routine (Mon and Fri)</summary><div class="body"><ul><li>Clothes and bag packed that morning, before leaving for work.</li><li>Phone away the moment you walk in.</li><li>5-minute shower, brush teeth in the shower.</li><li>Two minutes of box breathing in bed instead of the full wind-down.</li><li>Aim for lights out around 11:30–11:45 pm.</li><li>Hungry? Eat something light: warm milk with banana, a boiled egg, or yogurt.</li></ul></div></details>'+
    '<details><summary>Hungry, thirsty, or something else?</summary><div class="body"><ul><li>Hollow stomach: drink a full glass of water and wait 15–20 minutes. If it eases, it was thirst.</li><li>Still there? It is hunger. Eat normally.</li><li>Want to bite or crunch? Try sugar-free gum, raw carrot or cucumber, sunflower seeds in the shell, or a cold face towel.</li><li>True hunger makes plain food sound good. If only one specific food would do, it is probably something else.</li><li>Treats need no compensating before or after.</li></ul></div></details>'+
    '<details><summary>Meal timing around training and class</summary><div class="body"><ul><li>Training days: a light carb snack 15–20 minutes before. Dinner counts as the recovery meal within 30–60 minutes after.</li><li>Class days: a real dinner at school, 5:30–6:15 pm. Rainy day without the bike: onigiri or a wrap during class.</li><li>Late hunger after class or training: eat lightly rather than skipping it.</li><li>Short on protein at home? A boiled egg or canned tuna fills the gap.</li></ul></div></details>'+
    '<details><summary>Two-minute breathing</summary><div class="body"><ul><li><b>Box:</b> in 4, hold 4, out 4, hold 4. Four to six rounds.</li><li><b>Physiological sigh:</b> two short breaths in through the nose, one long breath out through the mouth. Three to five rounds.</li><li><b>4-7-8:</b> in 4, hold 7, out 8. Four rounds, best before bed.</li><li><b>Belly breathing:</b> one hand on the belly, only that hand rises. Five to ten minutes.</li></ul></div></details>'+
    '<details><summary>Changing exercises and logging cardio</summary><div class="body"><ul><li>Equipment missing or busy: on the Train tab, tap <b>Swap exercise</b> on that card. It only changes today.</li><li>New exercises for good: <b>Copy this block</b>, edit the copy, and it becomes a block you can pick any time.</li><li>Beyond Week 12: copy Weeks 1–4 and run it heavier, or rotate two or three lifts into new variations.</li><li>Walks, a weighted-vest walk, bike or stairs: Train, then <b>Cardio and walks</b>. Add the vest or pack weight in kg.</li></ul></div></details>'+
    '<details><summary>Why there is no calorie counter</summary><div class="body"><ul><li>Calorie estimates, in or out, are rough: step and workout formulas are often 20–30% off, and food labels and portions add more error. A precise-looking number can mislead.</li><li>In recovery the aim is enough fuel, not less. A daily “calories burned” figure tends to invite eating less to match it.</li><li>The Eating pattern card on Today tracks what is actually useful: whether meals happened, how many snacks, and what prompted them. A week or two shows patterns without any arithmetic.</li><li>If you ever want numbers, a dietitian can set a target and check it against your labs.</li></ul></div></details>'+
    '<details><summary>Watch numbers, kept in proportion</summary><div class="body"><ul><li>Sleep duration is the most useful number. Sleep score, HRV and watch stress are estimates built from heart rate and movement.</li><li>HRV swings a lot day to day. Only the multi-week direction means anything.</li><li>Watch “stress” is derived from heart-rate variability, not from how you feel. Your own stress rating on the Today tab matters as much.</li><li>If checking the numbers makes you more anxious, log fewer of them or none.</li></ul></div></details>'+
    '<details><summary>When the numbers do not move</summary><div class="body"><ul><li>Hormone panels fluctuate. One panel is a snapshot, not a verdict.</li><li>Fluctuating is different from getting worse.</li><li>Watch measurements and sleep before the scale.</li><li>No deadlines. Worry about the pace can become its own stressor.</li></ul></div></details>'+
    '<details><summary>Questions for your next visit</summary><div class="body"><p class="note">Edit these on the Summary tab so they print with your labs.</p></div></details></div>'+
    '<div id="datacard">'+dataCard()+'</div>';
  }
  async function doRestore(raw){
    let obj;try{obj=JSON.parse(raw);}catch(e){toast('That doesn’t look like a backup.');return;}
    const data=obj&&obj.data?obj.data:obj;let n=0;
    try{
      for(const c of COLS){const m=data[c];if(!m||typeof m!=='object')continue;
        for(const id of Object.keys(m)){await put(c,id,m[id]);n++;}}
      toast('Restored '+n+' entries');
    }catch(e){console.warn(e);toast('Restore stopped partway. Try again.');}
  }
  function backupJSON(){return JSON.stringify({app:'recovery-tracker',v:1,exported:new Date().toISOString(),data:S},null,1);}
  return {
    mount(r){
      root=r;root.innerHTML=html();
      root.addEventListener('click',async function(ev){
        const id=ev.target.id;
        if(id==='exportBtn'){
          try{const ok=await downloadFile('recovery-backup-'+today()+'.json',backupJSON());if(ok!==false){localStorage.setItem('recovery.lastBackup',new Date().toISOString());toast('Backup saved');const dc=$('#datacard',root);if(dc)dc.innerHTML=dataCard();}}
          catch(e){toast('Couldn’t create the file. Use “Show backup text instead”.');}
          return;
        }
        if(id==='exportTextBtn'){
          const out=$('#exportOut',root);out.innerHTML='<p class="note">Select all, copy, and paste into a note or file you keep private:</p><textarea class="mono" readonly rows="8" id="exportTa">'+esc(backupJSON())+'</textarea>';
          const ta=$('#exportTa',root);if(ta)ta.select();
          try{localStorage.setItem('recovery.lastBackup',new Date().toISOString());}catch(e){}
          return;
        }
        if(id==='restoreBtn'){
          const f=$('#restoreFile',root).files&&$('#restoreFile',root).files[0];
          if(f){const t=await f.text();await doRestore(t);$('#restoreFile',root).value='';}
          else{const raw=$('#restoreTa',root).value.trim();if(!raw){toast('Choose a backup file or paste its text first.');return;}await doRestore(raw);$('#restoreTa',root).value='';}
          const dc=$('#datacard',root);if(dc)dc.innerHTML=dataCard();
          return;
        }
        if(id==='reseedBtn'){
          let n=0;
          for(const c of COLS){const m=SEED&&SEED[c];if(!m)continue;for(const k of Object.keys(m)){if(!S[c][k]){await put(c,k,JSON.parse(JSON.stringify(m[k])));n++;}}}
          toast(n?('Added '+n+' entries'):'Everything is already there');
          const dc=$('#datacard',root);if(dc)dc.innerHTML=dataCard();return;
        }
        if(id==='eraseBtn'){
          const b=ev.target;
          if(!eraseArmed){eraseArmed=true;b.textContent='Tap again to erase everything';clearTimeout(eraseTimer);eraseTimer=setTimeout(()=>{eraseArmed=false;b.textContent='Erase all data';},5000);return;}
          eraseArmed=false;clearTimeout(eraseTimer);
          COLS.forEach(c=>{S[c]={};});
          try{localStorage.removeItem(LS_KEY);localStorage.removeItem('recovery.lastBackup');}catch(e){}
          toast('Everything on this device was erased');onData('*');
          const dc=$('#datacard',root);if(dc)dc.innerHTML=dataCard();
        }
      });
    },
    update(){const dc=$('#datacard',root);if(dc&&!eraseArmed)dc.innerHTML=dataCard();}
  };
}

function makeSummary(){

  const nl=t=>esc(t||'').replace(/\n/g,'<br>');
  const dash=(arr,max)=>arr.length?arr.slice(-max).map(fmtShort).join(', ')+(arr.length>max?' (+'+(arr.length-max)+' earlier)':''):'none logged';
  const ageFrom=dob=>{if(!dob)return null;const b=parseD(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a>=0&&a<130?a:null;};
  const fmtYM=ym=>{if(!ym)return '';const p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'});};
  const monthsSince=ym=>{if(!ym)return null;const p=ym.split('-').map(Number),n=new Date();return (n.getFullYear()-p[0])*12+(n.getMonth()+1-p[1]);};
  const fmtDur=m=>{if(m==null||m<0)return '';if(m<2)return 'under 2 months';if(m<24)return m+' months';const y=Math.floor(m/12),r=m%12;return y+' year'+(y===1?'':'s')+(r?' '+r+' month'+(r===1?'':'s'):'');};

    if(p.heightCm)parts.push(p.heightCm+' cm');
    if(p.weightKg)parts.push('about '+p.weightKg+' kg'+(p.weightAsOf?' (as of '+fmtYM(p.weightAsOf)+')':''));
    if(p.onset){const m=monthsSince(p.onset);parts.push('no spontaneous period since about '+fmtYM(p.onset)+(m!=null&&m>=0?' ('+fmtDur(m)+')':''));}
    return parts.join(' · ');

  function dailyWindow(){const cut=addDays(today(),-days);return Object.keys(S.daily).sort().filter(d=>d>=cut).map(d=>Object.assign({},S.daily[d],{date:d}));}

  function statsTable(D){

    let rows=row('Sleep (hours)','sleep',1)+row('Stress, own rating (1–5, 5 = heavy)','stress',1)+row('Mood, own rating (1–5, 5 = great)','mood',1)+row('Basal body temperature (°C)','bbt',2);
    if(inc.watch)rows+=row('Sleep score (watch)','sleepScore',0)+row('Overnight HRV (ms, watch)','hrv',0)+row('Resting heart rate (bpm, watch)','rhr',0)+row('Average stress (watch, 0–100)','wStress',0)+row('Body Battery, morning (watch)','battery',0)+row('Steps (watch)','steps',0);
